# Tiny Tapeout project information
project:
  title:        "TinyMPPT"      # Project title
  author:       "Fernando Graça"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Digital perturb-and-observe MPPT controller for reconfigurable RF energy harvesters."      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_tinymppt"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "power pulse input (1 pulse = 1 harvested energy packet)"
  ui[1]: "manual mode: 1 = force config from uio[3:0], 0 = auto P&O tracking"
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "rectifier config bit 0 (LSB)"
  uo[1]: "rectifier config bit 1"
  uo[2]: "rectifier config bit 2"
  uo[3]: "rectifier config bit 3 (MSB); uo[3:0] = stage count / load trim setting"
  uo[4]: "measurement window strobe (one pulse per ~1.6 ms power window)"
  uo[5]: "debug: search direction (1 = climbing up, 0 = climbing down)"
  uo[6]: "debug: manual mode echo (copy of ui[1])"
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "manual config bit 0 (input only, used when ui[1] = 1)"
  uio[1]: "manual config bit 1 (input only, used when ui[1] = 1)"
  uio[2]: "manual config bit 2 (input only, used when ui[1] = 1)"
  uio[3]: "manual config bit 3 (input only, used when ui[1] = 1)"
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
